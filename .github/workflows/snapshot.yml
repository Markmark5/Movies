name: snapshot

on:
  # GitHub can delay or skip scheduled runs when busy, so there's a backup slot.
  # A second run on the same day is harmless. Times are UTC (add 1 hour for UK summer time).
  schedule:
    - cron: "23 3 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Take snapshot
        run: node scripts/snapshot.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Commit data if changed
        run: |
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: snapshot $(TZ=Europe/London date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
