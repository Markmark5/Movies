<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2140">
<meta name="robots" content="noindex, nofollow">
<title>Tonight's Film</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c2140; --surface:#272d55; --line:#3a4175; --text:#f3eee4; --muted:#a9acc9;
  --accent:#f2b134; --good:#7fd6a8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#1c2140;border-color:var(--accent);font-weight:600}
.controls{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;margin-top:10px}
.selects{display:flex;gap:8px}
.selects select{flex:1;min-width:0}
header,main{max-width:100vw;overflow-x:hidden}
.slider{min-width:0}
.slider{display:flex;align-items:center;gap:10px;font-size:.9rem}
.slider input{flex:1;accent-color:var(--accent)}
.slider b{min-width:2.4em;color:var(--accent);font-size:1.1rem}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.toggles{display:flex;gap:16px;margin-top:8px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.toggles label{display:flex;gap:6px;align-items:center}
.toggles input{accent-color:var(--accent);width:18px;height:18px}
main{padding:14px 16px 40px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.film{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.film img,.film .noimg{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--surface);display:block}
.film .noimg{display:grid;place-items:center;color:var(--muted);font-size:.8rem;padding:8px;text-align:center}
.film h3{margin:6px 0 0;font-size:.85rem;font-weight:600;line-height:1.2}
.meta{font-size:.75rem;flex-wrap:wrap;color:var(--muted);display:flex;gap:8px}
.meta .imdb{color:var(--accent);font-weight:600}
.status{color:var(--muted);text-align:center;padding:24px 0}
.more{display:block;margin:20px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 20px;cursor:pointer}
dialog{border:0;border-radius:12px;background:var(--surface);color:var(--text);padding:0;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,12,30,.75)}
.dbody{padding:18px}
.dbody h2{margin:0 0 4px;font-size:1.5rem;line-height:1.15}
.dbody p{margin:10px 0}
.provs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.provs img{width:40px;height:40px;border-radius:8px}
.backdrop{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.fav{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;margin-top:10px}
.fav[aria-pressed="true"]{background:var(--accent);color:#1c2140;border-color:var(--accent);font-weight:600}
.film{position:relative}
.film .heart{position:absolute;top:6px;right:6px;background:var(--accent);color:#1c2140;border-radius:999px;width:26px;height:26px;display:grid;place-items:center;font-size:.85rem}
.ftoggle{position:absolute;right:52px;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer}
header.collapsed #filters, header.collapsed .sub{display:none}
header.collapsed{padding-bottom:12px}
header.collapsed h1{font-size:1.4rem}
header.collapsed .ftoggle{top:8px}
header.collapsed .gear{top:6px}
.close{float:right;background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted)}
.setup{max-width:480px;margin:30px auto;background:var(--surface);padding:20px;border-radius:12px}
.setup input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 14px}
.setup button{background:var(--accent);color:#1c2140;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.setup small{color:var(--muted);display:block;margin-top:-8px;margin-bottom:14px}
.gear{position:absolute;right:16px;top:14px;background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer}
header{position:sticky}
.hwrap{position:relative}
.warn{color:#ff9c8a;font-size:.8rem;margin-top:6px}
.dayhead{grid-column:1/-1;margin:10px 0 0;font-size:1rem;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.dayhead:first-child{margin-top:0}
.note{grid-column:1/-1;color:var(--muted);font-size:.8rem}
.plogos{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.plogos img{width:18px;height:18px;border-radius:4px}
.cert{border:1.5px solid var(--muted);border-radius:4px;padding:0 5px;font-weight:600;font-size:.72rem;line-height:1.5}
.tagline{font-style:italic;color:var(--muted)}
.people{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.people .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.name{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:.85rem;cursor:pointer}
.name.dir{border-color:var(--accent);color:var(--accent);font-weight:600}
.dnav{position:sticky;top:0;z-index:2;background:var(--surface);padding:10px 14px;border-bottom:1px solid var(--line)}
.back{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.9rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgrid{margin-top:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.dgrid .film img,.dgrid .film .noimg{background:var(--bg)}
.offlist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.offlist li{display:flex;justify-content:space-between;gap:12px}
.offlist li span:first-child{color:var(--text)}
details.off{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.off summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.links{display:flex;flex-wrap:wrap;gap:6px 16px}
.links a{color:var(--accent)}
</style>
</head>
<body>

<div id="setup" class="setup" hidden>
  <h2 style="margin-top:0">Add your keys</h2>
  <label for="tmdbKey">TMDB API key or read-access token</label>
  <input id="tmdbKey" autocomplete="off">
  <label for="omdbKey">OMDb key (optional, for real IMDb ratings)</label>
  <input id="omdbKey" autocomplete="off">
  <small>Free at omdbapi.com. Without it, the rating filter uses TMDB's score.</small>
  <button id="saveKeys">Save keys</button>
  <p id="setupErr" style="color:#ff9c8a"></p>
</div>

<div id="app" hidden>
<header>
  <div class="hwrap">
    <h1>Tonight's Film</h1>
    <div class="sub" id="sub">UK streaming, English language</div>
    <button class="gear" id="gear" aria-label="Edit keys">⚙</button>
    <button class="ftoggle" id="ftoggle" aria-expanded="true">Hide filters ▴</button>
  </div>
  <div class="warn" id="warn" hidden></div>
  <div id="filters">
  <div class="row" id="providers" aria-label="Streaming services"></div>
  <div class="controls">
    <div class="slider">
      <span id="ratingLabel">IMDb</span>
      <input type="range" id="minRating" min="5" max="8.5" step="0.1" value="6.5" aria-label="Minimum rating">
      <b id="ratingVal">6.5</b>
    </div>
    <div class="selects">
    <select id="decade" aria-label="Decade">
      <option value="">Any decade</option><option value="2020">2020s</option><option value="2010">2010s</option><option value="2000">2000s</option><option value="1990">1990s</option><option value="1980">1980s</option><option value="1970">1970s</option><option value="1960">1960s</option><option value="1950">1950s</option><option value="1940">1940s</option><option value="1930">1930s</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="popularity.desc">Popular</option>
      <option value="vote_average.desc">Top rated</option>
      <option value="primary_release_date.desc">Newest</option>
      <option value="new7">New this week</option>
      <option value="new30">New this month</option>
      <option value="favourites">♥ Favourites</option>
    </select>
    </div>
  </div>
  <div class="row" id="genres" style="margin-top:10px" aria-label="Genres"></div>
  <div class="toggles">
    <label>Min IMDb votes <select id="minVotes" aria-label="Minimum IMDb votes">
      <option value="0">Any</option><option value="1000" selected>1k</option>
      <option value="5000">5k</option><option value="25000">25k</option></select></label>
    <label><input type="checkbox" id="englishOnly" checked> English only</label>
    <label><input type="checkbox" id="britishOnly"> British only</label>
    <label><input type="checkbox" id="freeOnly"> Free services only</label>
  </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="status" id="status"></div>
  <div id="more" hidden style="height:1px"></div>
</main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
// ===== Paste your keys here so family don't need their own =====
const DEFAULT_TMDB = "177a02c82929d03b8709ddffe5e7ea95";
const DEFAULT_OMDB = "9db131e0";
// ================================================================
const IMG = "https://image.tmdb.org/t/p/";
const DEFAULTS = [/^netflix$/i, /^amazon prime video$/i, /bbc iplayer/i, /^itvx$|itv hub/i, /^channel 4$|all 4/i];
const FREE_RE = /iplayer|itvx|itv hub|channel 4|all 4|my5|channel 5|^u$|uktv|tptv|talking pictures|pluto|tubi|freevee|rakuten|plex|stv|s4c|bbc/i;
const SHORT = {"Amazon Prime Video":"Prime Video","Disney Plus":"Disney+","Paramount Plus":"Paramount+","Apple TV Plus":"Apple TV+"};
const S = {
  tmdb: store("tmdbKey") || DEFAULT_TMDB, omdb: store("omdbKey") || DEFAULT_OMDB,
  allProviders: [], providers: [], shown: JSON.parse(store("shown")||"null"), active: new Set(JSON.parse(store("active")||"null")||[]),
  genres: new Set(), page: 1, totalPages: 1, loading: false, seen: new Set(),
  imdbCache: JSON.parse(store("imdbCache3")||"{}"), ratings: {},
  favs: JSON.parse(store("favs")||"{}")
};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const $ = id => document.getElementById(id);

async function tmdb(path, params={}){
  const u = new URL("https://api.themoviedb.org/3"+path);
  const bearer = S.tmdb.length > 40;
  if(!bearer) u.searchParams.set("api_key", S.tmdb);
  for(const [k,v] of Object.entries(params)) if(v!==""&&v!=null) u.searchParams.set(k,v);
  const r = await fetch(u, {headers: bearer ? {Authorization:"Bearer "+S.tmdb} : {}});
  if(!r.ok) throw new Error(r.status===401 ? "TMDB rejected the key. Check it in settings." : "TMDB error "+r.status);
  return r.json();
}

async function imdbRating(tmdbId){
  // Daily IMDb ratings file from the snapshot Action first; OMDb only for films not in it
  const d = S.ratings[tmdbId];
  if(d) return {r:d[0], id:"tt"+String(d[2]).padStart(7,"0"), votes:d[1]};
  if(S.imdbCache[tmdbId] !== undefined) return S.imdbCache[tmdbId];
  if(omdbWarned) return undefined;
  try{
    const ext = await tmdb(`/movie/${tmdbId}/external_ids`);
    if(!ext.imdb_id){ S.imdbCache[tmdbId]=null; return null; }
    const r = await fetch(`https://www.omdbapi.com/?apikey=${encodeURIComponent(S.omdb)}&i=${ext.imdb_id}`);
    const d = await r.json();
    if(d.Response === "False"){ if(/api key|limit|unauthori/i.test(d.Error||"")){ omdbError(d.Error); return undefined; } S.imdbCache[tmdbId]=null; store("imdbCache3", JSON.stringify(S.imdbCache)); return null; }
    const v = parseFloat(d.imdbRating);
    const votes = parseInt(String(d.imdbVotes||"").replace(/,/g,""),10);
    S.imdbCache[tmdbId] = isNaN(v) ? null : {r:v, id:ext.imdb_id, votes:isNaN(votes)?0:votes};
  }catch(e){ return undefined; }
  store("imdbCache3", JSON.stringify(S.imdbCache));
  return S.imdbCache[tmdbId];
}

let omdbWarned=false;
function omdbError(msg){ if(omdbWarned) return; omdbWarned=true;
  $("warn").textContent = "IMDb lookup limit reached ("+(msg||"check OMDb key")+"). Films on untracked services show TMDB scores.";
  $("warn").hidden = false; }

async function init(){
  if(!S.tmdb){ $("setup").hidden=false; return; }
  $("app").hidden=false;
  $("ratingLabel").textContent = S.omdb ? "IMDb" : "Rating";
  try{
    const [pv, gn, rt] = await Promise.all([
      tmdb("/watch/providers/movie",{watch_region:"GB"}),
      tmdb("/genre/movie/list",{language:"en-GB"}),
      fetch(`data/ratings.json?t=${dayOffset(0)}`).then(r=>r.ok ? r.json() : {}).catch(()=>({}))
    ]);
    S.ratings = rt;
    S.allProviders = pv.results
      .sort((a,b)=>(a.display_priorities?.GB ?? a.display_priority ?? 999)-(b.display_priorities?.GB ?? b.display_priority ?? 999))
      .map(p=>({id:p.provider_id, name:p.provider_name, label:SHORT[p.provider_name]||p.provider_name, logo:p.logo_path, free:FREE_RE.test(p.provider_name)}));
    if(!S.shown){
      S.shown = DEFAULTS.map(re=>S.allProviders.find(p=>re.test(p.name))).filter(Boolean).map(p=>p.id);
      store("shown", JSON.stringify(S.shown));
    }
    setProviders();
    if(!S.active.size) S.providers.forEach(p=>S.active.add(p.id));
    renderChips(); renderGenres(gn.genres);
    search(true);
  }catch(e){ $("status").textContent = e.message; }
}

function setProviders(){
  S.providers = S.shown.map(id=>S.allProviders.find(p=>p.id===id)).filter(Boolean);
}
function renderChips(){
  $("providers").innerHTML = "";
  S.providers.forEach(p=>{
    const b = document.createElement("button");
    b.className="chip"; b.textContent=p.label;
    b.setAttribute("aria-pressed", S.active.has(p.id));
    b.onclick=()=>{
      S.active.has(p.id) ? S.active.delete(p.id) : S.active.add(p.id);
      store("active", JSON.stringify([...S.active]));
      b.setAttribute("aria-pressed", S.active.has(p.id)); search(true);
    };
    $("providers").appendChild(b);
  });
  const add = document.createElement("button");
  add.className="chip"; add.textContent="+ More services"; add.onclick=openServices;
  $("providers").appendChild(add);
}
function openServices(){
  const q = `<input id="svcQ" placeholder="Search services" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0">`;
  $("dlgBody").innerHTML = `<div class="dbody"><button class="close" onclick="dlg.close()" aria-label="Close">×</button>
    <h2>Choose services</h2><div class="meta">Every UK service TMDB tracks</div>${q}
    <div id="svcList"></div>
    <button class="more" id="svcDone">Done</button></div>`;
  const draw = (f="") => {
    $("svcList").innerHTML = S.allProviders.filter(p=>p.name.toLowerCase().includes(f.toLowerCase())).map(p=>`
      <label style="display:flex;align-items:center;gap:10px;padding:6px 0">
        <input type="checkbox" data-id="${p.id}" ${S.shown.includes(p.id)?"checked":""} style="width:20px;height:20px;accent-color:var(--accent)">
        <img src="${IMG}w92${p.logo}" alt="" style="width:32px;height:32px;border-radius:6px">
        <span>${esc(p.name)}</span></label>`).join("") || `<p class="meta">No service by that name.</p>`;
    $("svcList").querySelectorAll("input").forEach(cb=>cb.onchange=()=>{
      const id=+cb.dataset.id;
      if(cb.checked){ if(!S.shown.includes(id)){ S.shown.push(id); S.active.add(id);} }
      else { S.shown=S.shown.filter(x=>x!==id); S.active.delete(id); }
    });
  };
  draw();
  $("svcQ").oninput = e => draw(e.target.value);
  $("svcDone").onclick = () => {
    store("shown", JSON.stringify(S.shown)); store("active", JSON.stringify([...S.active]));
    setProviders(); renderChips(); $("dlg").close(); search(true);
  };
  $("dlg").showModal();
}
function renderGenres(list){
  const keep = ["Action","Comedy","Crime","Drama","Thriller","Science Fiction","Horror","Documentary","Romance","Animation","Family","History","Mystery","War"];
  list.filter(g=>keep.includes(g.name)).forEach(g=>{
    const b = document.createElement("button");
    b.className="chip"; b.textContent = g.name==="Science Fiction"?"Sci-fi":g.name;
    b.setAttribute("aria-pressed","false");
    b.onclick=()=>{ S.genres.has(g.id)?S.genres.delete(g.id):S.genres.add(g.id);
      b.setAttribute("aria-pressed",S.genres.has(g.id)); search(true); };
    $("genres").appendChild(b);
  });
}

function activeProviderIds(){
  const free = $("freeOnly").checked;
  return S.providers.filter(p=>S.active.has(p.id) && (!free || p.free)).map(p=>p.id);
}

let token = 0;
function showFavourites(){
  ++token; $("grid").innerHTML=""; $("more").hidden=true;
  const list = Object.values(S.favs).sort((a,b)=>b.added-a.added);
  list.forEach(f=>addCard(f.m, f.rating));
  $("status").textContent = list.length ? "" : "No favourites yet. Tap a film, then tap ♡ Add to favourites.";
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
let arrivalsData;
async function loadArrivals(){
  if(arrivalsData) return arrivalsData;
  try{ const r = await fetch(`data/arrivals.json?t=${dayOffset(0)}`); if(r.ok) arrivalsData = await r.json(); }catch(e){}
  return arrivalsData;
}
function dayLabel(d){
  if(d===dayOffset(0)) return "Today";
  if(d===dayOffset(-1)) return "Yesterday";
  return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
async function showArrivals(days){
  const my = ++token; $("grid").innerHTML=""; $("more").hidden=true; $("status").textContent="Loading…";
  const data = await loadArrivals();
  if(my!==token) return;
  if(!data || !(data.items||[]).length){ $("status").textContent="New arrivals start building from the first daily check. Check back tomorrow."; return; }
  const ids = new Set(activeProviderIds().map(String));
  if(!ids.size){ $("status").textContent="Pick at least one service."; return; }
  const cutoff = dayOffset(-(days-1)), dec = $("decade").value, min = parseFloat($("minRating").value), useImdb = !!S.omdb || !!Object.keys(S.ratings).length;
  const list = [];
  for(const m of data.items){
    const on = Object.entries(m.arrivals||{}).filter(([p,d])=>ids.has(p) && d>=cutoff);
    if(!on.length) continue;
    if($("englishOnly").checked && m.original_language!=="en") continue;
    if($("britishOnly").checked && !(m.origin_country||[]).includes("GB")) continue;
    if([...S.genres].some(g=>!(m.genre_ids||[]).includes(g))) continue;
    const yr = +(m.release_date||"").slice(0,4);
    if(dec && !(yr>=+dec && yr<=+dec+9)) continue;
    list.push({m, date: on.map(x=>x[1]).sort().at(-1), provs: on.map(x=>+x[0])});
  }
  list.sort((a,b)=>b.date.localeCompare(a.date) || b.m.vote_count-a.m.vote_count);
  if(data.baselineDate && dayOffset(-7) < data.baselineDate)
    $("grid").insertAdjacentHTML("beforeend", `<div class="note">Tracking since ${esc(dayLabel(data.baselineDate))}</div>`);
  let lastDay = "", shown = 0;
  // Look up IMDb ratings a few at a time, but render in order
  for(let i=0; i<list.length; i+=6){
    const chunk = list.slice(i,i+6);
    const ratings = useImdb ? await Promise.all(chunk.map(x=>imdbRating(x.m.id))) : [];
    if(my!==token) return;
    chunk.forEach(({m,date,provs},k)=>{
      let rating = {r:m.vote_average||0, src:"TMDB"};
      const r = ratings[k];
      if(r){ if(r.r < min || r.votes < +$("minVotes").value) return; rating = {r:r.r, src:"IMDb", id:r.id, votes:r.votes}; }
      else if(rating.r < min) return;
      if(date!==lastDay){ lastDay=date; $("grid").insertAdjacentHTML("beforeend", `<h2 class="dayhead">${esc(dayLabel(date))}</h2>`); }
      const card = addCard(m, rating);
      card.insertAdjacentHTML("beforeend", `<div class="plogos">${provs.map(id=>S.allProviders.find(p=>p.id===id)).filter(Boolean)
        .map(p=>`<img src="${IMG}w92${p.logo}" alt="${esc(p.name)}" title="${esc(p.name)}">`).join("")}</div>`);
      shown++;
    });
  }
  $("status").textContent = shown ? "" : `No new arrivals match in the last ${days} days. Try lowering the rating or adding a service.`;
}
// Top rated: sort the daily catalogue by IMDb rating. Falls back to TMDB's order when a selected service isn't tracked.
let catalogueData;
async function loadCatalogue(){
  if(catalogueData) return catalogueData;
  try{ const r = await fetch(`data/catalogue.json?t=${dayOffset(0)}`); if(r.ok) catalogueData = await r.json(); }catch(e){}
  return catalogueData;
}
async function topRated(){
  const my = ++token; S.topMode = false;
  $("grid").innerHTML=""; $("more").hidden=true; $("status").textContent="Loading…";
  const cat = await loadCatalogue();
  if(my!==token) return true;
  const ids = activeProviderIds();
  const untracked = cat ? S.providers.filter(p=>ids.includes(p.id) && !cat.providers.includes(p.id)).map(p=>p.label) : [];
  $("warn").hidden = !untracked.length;
  if(untracked.length) $("warn").textContent = `Top rated is in TMDB order because ${untracked.join(", ")} ${untracked.length>1?"aren't":"isn't"} in the daily check.`;
  if(!cat || !ids.length || untracked.length) return false;
  const set = new Set(ids), min = parseFloat($("minRating").value), minV = +$("minVotes").value, dec = +$("decade").value;
  const eng = $("englishOnly").checked, brit = $("britishOnly").checked, gs = [...S.genres];
  S.top = cat.rows.filter(r => r[7].some(p=>set.has(p))
      && (!eng || r[4]==="en") && (!brit || r[6].split(",").includes("GB"))
      && gs.every(g=>r[5].includes(g)) && (!dec || (r[3]>=dec && r[3]<=dec+9))
      && (r[8]!=null ? r[8]>=min && r[9]>=minV : r[10]>=min))
    .map(r => ({ m:{id:r[0], title:r[1], poster_path:r[2]?`/${r[2]}.jpg`:null, release_date:String(r[3]||""), vote_average:r[8]??r[10]},
      rating: r[8]!=null ? {r:r[8], src:"IMDb", votes:r[9]} : {r:r[10], src:"TMDB"} }));
  S.topPos = 0; S.topMode = true;
  showTopBatch();
  return true;
}
function showTopBatch(){
  S.top.slice(S.topPos, S.topPos+30).forEach(x=>addCard(x.m, x.rating));
  S.topPos += 30;
  $("status").textContent = S.top.length ? "" : "No films match. Try lowering the rating or adding a service.";
  // Re-show the scroll sentinel after a frame so the observer notices it if it's still on screen
  $("more").hidden = true;
  requestAnimationFrame(()=>{ $("more").hidden = S.topPos >= S.top.length; });
}
async function search(reset){
  if(reset && $("warn").textContent.startsWith("Top rated")) $("warn").hidden = true;
  if($("sort").value==="favourites"){ showFavourites(); return; }
  if($("sort").value==="vote_average.desc"){
    if(!reset && S.topMode){ showTopBatch(); return; }
    if(reset && await topRated()) return;
  }
  if($("sort").value==="new7" || $("sort").value==="new30"){ showArrivals($("sort").value==="new7" ? 7 : 30); return; }
  const my = ++token;
  if(reset){ S.page=1; S.seen.clear(); $("grid").innerHTML=""; }
  const ids = activeProviderIds();
  if(!ids.length){ $("status").textContent="Pick at least one service."; $("more").hidden=true; return; }
  const min = parseFloat($("minRating").value);
  const useImdb = !!S.omdb || !!Object.keys(S.ratings).length;
  S.loading = true; $("more").hidden = true; $("status").textContent="Loading…";
  let shown = 0, pagesTried = 0;
  // Keep pulling pages until we have ~12 new films or run out
  while(shown < 12 && S.page <= S.totalPages && pagesTried < 5){
    const d = await tmdb("/discover/movie",{
      watch_region:"GB", region:"GB", language:"en-GB",
      with_watch_providers: ids.join("|"),
      with_watch_monetization_types:"flatrate|free|ads",
      with_original_language: $("englishOnly").checked ? "en" : "",
      with_genres: [...S.genres].join(","),
      with_origin_country: $("britishOnly").checked ? "GB" : "",
      "primary_release_date.gte": $("decade").value ? $("decade").value+"-01-01" : "",
      "primary_release_date.lte": $("decade").value ? (+$("decade").value+9)+"-12-31" : "",
      // TMDB pre-filter a bit below the target so IMDb can decide
      "vote_average.gte": useImdb ? Math.max(0, min-0.8) : min,
      "vote_count.gte": ($("sort").value==="primary_release_date.desc" || ($("decade").value && +$("decade").value < 1980)) ? 50 : 200,
      sort_by: $("sort").value, include_adult:false, page:S.page
    }).catch(e=>{ $("status").textContent=e.message; return null; });
    if(my!==token || !d) return;
    S.totalPages = Math.min(d.total_pages, 500); S.page++; pagesTried++;
    for(const m of d.results){
      if(S.seen.has(m.id)) continue; S.seen.add(m.id);
      let rating = {r:m.vote_average, src:"TMDB"};
      if(useImdb){
        const i = await imdbRating(m.id);
        if(my!==token) return;
        if(i && i.r < min) continue;
        if(i && i.votes < +$("minVotes").value) continue;
        if(i) rating = {r:i.r, src:"IMDb", id:i.id, votes:i.votes};
        else if(m.vote_average < min) continue;
      }
      addCard(m, rating); shown++;
    }
  }
  S.loading=false;
  $("status").textContent = $("grid").children.length ? "" : "No films match. Try lowering the rating or adding a service.";
  $("more").hidden = S.page > S.totalPages;
}

function addCard(m, rating, target=$("grid"), back){
  const b = document.createElement("button");
  b.className="film";
  const yr = (m.release_date||"").slice(0,4);
  b.innerHTML = (m.poster_path ? `<img loading="lazy" src="${IMG}w342${m.poster_path}" alt="">` : `<div class="noimg">${esc(m.title)}</div>`)
    + `<h3>${esc(m.title)}</h3><div class="meta"><span>${yr}</span><span class="${rating.src==="IMDb"?"imdb":""}">★ ${rating.r.toFixed(1)} ${rating.src}</span></div>`;
  if(S.favs[m.id]) b.insertAdjacentHTML("beforeend", `<span class="heart" aria-label="Favourite">♥</span>`);
  b.dataset.id = m.id;
  b.onclick=()=>openFilm(m, rating, back);
  target.appendChild(b);
  return b;
}

// back = {label, go} when the popup was opened from a person's list.
// Each step adds a browser history entry, so the phone's back gesture steps back too.
let dlgToken = 0, dlgDepth = 0, dlgPopping = false, dlgBack = null;
function dlgLoading(back){
  dlgBack = back || null;
  $("dlgBody").innerHTML = `${backBtn(back)}<div class="dbody">Loading…</div>`;
  if(!$("dlg").open){ $("dlg").showModal(); dlgDepth = 0; }
  if(!dlgPopping){ try{ history.pushState({dlg:dlgDepth+1}, ""); dlgDepth++; }catch(e){} }
  $("dlg").scrollTop = 0;
  return ++dlgToken;
}
const backBtn = back => back ? `<div class="dnav"><button class="back" onclick="history.back()">‹ ${esc(back.label)}</button></div>` : "";
window.addEventListener("popstate", () => {
  if(!$("dlg").open || dlgDepth <= 0) return;
  dlgDepth--;
  if(dlgDepth > 0 && dlgBack){ dlgPopping = true; try{ dlgBack.go(); } finally { dlgPopping = false; } }
  else $("dlg").close();
});
$("dlg").addEventListener("close", () => { if(dlgDepth > 0){ const n = dlgDepth; dlgDepth = 0; history.go(-n); } });
async function openFilm(m, rating, back){
  const my = dlgLoading(back);
  const [d, wp] = await Promise.all([
    tmdb(`/movie/${m.id}`,{language:"en-GB", append_to_response:"credits,release_dates,videos", include_video_language:"en,null"}),
    tmdb(`/movie/${m.id}/watch/providers`)
  ]).catch(e=>[null,null]);
  if(my!==dlgToken) return;
  if(!d){ $("dlgBody").innerHTML=`<div class="dbody">Couldn't load this film.</div>`; return; }
  const cert = ((d.release_dates?.results||[]).find(r=>r.iso_3166_1==="GB")?.release_dates||[]).map(r=>r.certification).find(Boolean);
  const vids = (d.videos?.results||[]).filter(v=>v.site==="YouTube" && v.type==="Trailer");
  const trailer = vids.find(v=>v.official) || vids[0];
  const directors = (d.credits?.crew||[]).filter(c=>c.job==="Director");
  const cast = (d.credits?.cast||[]).slice(0,5);
  const self = {label:d.title, go:()=>openFilm(m, rating, back)};
  const gb = (wp.results||{}).GB || {};
  const mine = new Set(S.shown);
  const on = [...(gb.flatrate||[]),...(gb.free||[]),...(gb.ads||[])].filter(p=>mine.has(p.provider_id));
  const uniq = [...new Map(on.map(p=>[p.provider_id,p])).values()];
  $("dlgBody").innerHTML = `${backBtn(back)}
    ${d.backdrop_path?`<img class="backdrop" src="${IMG}w780${d.backdrop_path}" alt="">`:""}
    <div class="dbody">
      <button class="close" onclick="dlg.close()" aria-label="Close">×</button>
      <h2>${esc(d.title)}</h2>
      <div class="meta"><span>${(d.release_date||"").slice(0,4)}</span><span>${d.runtime?d.runtime+" min":""}</span>${cert?`<span class="cert">${esc(cert)}</span>`:""}
        <span class="imdb">★ ${rating.r.toFixed(1)} ${rating.src}</span>${rating.votes?`<span>${rating.votes.toLocaleString("en-GB")} votes</span>`:""}</div>
      <button class="fav" id="favBtn" aria-pressed="${!!S.favs[m.id]}">${S.favs[m.id]?"♥ In favourites":"♡ Add to favourites"}</button>
      ${d.tagline?`<p class="tagline">${esc(d.tagline)}</p>`:""}
      <p>${esc(d.overview||"")}</p>
      ${directors.length?`<div class="people"><span class="label">Directed by</span><div class="names">${directors.map(c=>`<button class="name dir" data-pid="${c.id}" data-job="Director" data-pname="${esc(c.name)}">${esc(c.name)} ›</button>`).join("")}</div></div>`:""}
      ${cast.length?`<div class="people"><span class="label">Starring</span><div class="names">${cast.map(c=>`<button class="name" data-pid="${c.id}" data-job="Actor" data-pname="${esc(c.name)}">${esc(c.name)}</button>`).join("")}</div></div>`:""}
      <div class="meta">${d.genres.map(g=>g.name).join(", ")}</div>
      <div class="provs">${uniq.map(p=>`<img src="${IMG}w92${p.logo_path}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}">`).join("")}</div>
      <p class="links">${gb.link?`<a href="${gb.link}" target="_blank" rel="noopener">Where to watch</a>`:""}
      ${(d.imdb_id||rating.id)?`<a href="https://www.imdb.com/title/${d.imdb_id||rating.id}/" target="_blank" rel="noopener">IMDb page</a>`:""}
      ${trailer?`<a href="https://www.youtube.com/watch?v=${encodeURIComponent(trailer.key)}" target="_blank" rel="noopener">▶ Trailer</a>`:""}</p>
    </div>`;
  $("favBtn").onclick = () => toggleFav(m, rating);
  $("dlgBody").querySelectorAll("[data-pid]").forEach(b => b.onclick = () =>
    openPerson({id:+b.dataset.pid, name:b.dataset.pname, job:b.dataset.job}, self));
}

// A director's or actor's films: those on your selected services first (sorted by IMDb), the rest listed below
async function openPerson(p, back){
  const my = dlgLoading(back);
  const ids = S.providers.map(x=>x.id).filter(id=>S.active.has(id));
  const [credits, cat, ...pages] = await Promise.all([
    tmdb(`/person/${p.id}/movie_credits`,{language:"en-GB"}),
    loadCatalogue(),
    ...[1,2,3].map(page => ids.length ? tmdb("/discover/movie",{watch_region:"GB", with_people:p.id, with_watch_providers:ids.join("|"),
      with_watch_monetization_types:"flatrate|free|ads", include_adult:false, sort_by:"popularity.desc", page}).catch(()=>null) : null)
  ]).catch(()=>[null]);
  if(my!==dlgToken) return;
  if(!credits){ $("dlgBody").innerHTML=`<div class="dbody">Couldn't load ${esc(p.name)}'s films.</div>`; return; }
  const theirs = p.job==="Director" ? credits.crew.filter(c=>c.job==="Director") : credits.cast.filter(c=>!/\b(self|himself|herself)\b/i.test(c.character||""));
  const mineIds = new Set(pages.flatMap(d=>d?.results||[]).map(m=>m.id));
  const uniq = [...new Map(theirs.map(m=>[m.id,m])).values()];
  const on = uniq.filter(m=>mineIds.has(m.id)), off = uniq.filter(m=>!mineIds.has(m.id));
  const rated = await Promise.all(on.map(async m => {
    const i = await imdbRating(m.id);
    return {m, rating: i ? {r:i.r, src:"IMDb", id:i.id, votes:i.votes} : {r:m.vote_average||0, src:"TMDB"}};
  }));
  if(my!==dlgToken) return;
  rated.sort((a,b)=>b.rating.r-a.rating.r);
  off.sort((a,b)=>(b.release_date||"9999").localeCompare(a.release_date||"9999"));
  const rows = cat ? new Map(cat.rows.map(r=>[r[0],r])) : new Map();
  const self = {label:p.name, go:()=>openPerson(p, back)};
  $("dlgBody").innerHTML = `${backBtn(back)}<div class="dbody">
      <button class="close" onclick="dlg.close()" aria-label="Close">×</button>
      <h2>${esc(p.name)}</h2>
      <div class="meta">${p.job} · ${rated.length} film${rated.length===1?"":"s"} on your services${rated.length>1?" · sorted by IMDb":""}</div>
      <div class="grid dgrid" id="pgrid"></div>
      ${off.length?`<details class="off"><summary>${off.length} more not on your services</summary><ul class="offlist">${off.slice(0,40).map(m=>
        `<li><span>${esc(m.title)}</span><span>${(m.release_date||"").slice(0,4)||"TBA"}</span></li>`).join("")}${off.length>40?`<li><span>…and ${off.length-40} more</span></li>`:""}</ul></details>`:""}
    </div>`;
  if(!rated.length) $("pgrid").outerHTML = `<p class="meta">None on your selected services right now.</p>`;
  rated.forEach(({m, rating}) => {
    const card = addCard(m, rating, $("pgrid"), self);
    const ps = rows.get(m.id)?.[7] || [];
    const logos = ps.filter(id=>ids.includes(id)).map(id=>S.allProviders.find(x=>x.id===id)).filter(Boolean);
    if(logos.length) card.insertAdjacentHTML("beforeend", `<div class="plogos">${logos.map(x=>`<img src="${IMG}w92${x.logo}" alt="${esc(x.name)}" title="${esc(x.name)}">`).join("")}</div>`);
  });
}
function toggleFav(m, rating){
  if(S.favs[m.id]) delete S.favs[m.id];
  else S.favs[m.id] = {m:{id:m.id,title:m.title,poster_path:m.poster_path,release_date:m.release_date,vote_average:m.vote_average}, rating, added:Date.now()};
  store("favs", JSON.stringify(S.favs));
  const on = !!S.favs[m.id], btn = $("favBtn");
  btn.setAttribute("aria-pressed", on); btn.textContent = on ? "♥ In favourites" : "♡ Add to favourites";
  document.querySelectorAll(`.film[data-id="${m.id}"]`).forEach(card => { const h = card.querySelector(".heart");
    if(on && !h) card.insertAdjacentHTML("beforeend", `<span class="heart" aria-label="Favourite">♥</span>`);
    if(!on && h) h.remove(); });
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

let debounce;
$("minRating").oninput = e => { $("ratingVal").textContent = (+e.target.value).toFixed(1);
  clearTimeout(debounce); debounce = setTimeout(()=>search(true), 400); };
$("minVotes").value = store("minVotes") || "1000";
$("minVotes").onchange = e => { store("minVotes", e.target.value); search(true); };
$("britishOnly").checked = store("britishOnly")==="1";
$("decade").value = store("decade") || "";
$("decade").addEventListener("change", e=>store("decade", e.target.value));
$("britishOnly").addEventListener("change", e=>store("britishOnly", e.target.checked?"1":"0"));
$("decade").onchange = $("sort").onchange = $("britishOnly").onchange = $("englishOnly").onchange = $("freeOnly").onchange = () => search(true);
// Load the next batch automatically as the bottom of the list comes into view
new IntersectionObserver(es => { if(es[0].isIntersecting && !$("more").hidden) search(false); }, {rootMargin:"800px 0px"}).observe($("more"));
function setCollapsed(c){
  document.querySelector("header").classList.toggle("collapsed", c);
  $("ftoggle").textContent = c ? "Filters ▾" : "Hide filters ▴";
  $("ftoggle").setAttribute("aria-expanded", !c);
  store("collapsed", c ? "1" : "0");
}
$("ftoggle").onclick = () => setCollapsed(!document.querySelector("header").classList.contains("collapsed"));
setCollapsed(true);
$("dlg").addEventListener("close", ()=>{ if($("sort").value==="favourites") showFavourites(); });
$("dlg").addEventListener("click", e=>{ if(e.target.id==="dlg") e.target.close(); });
$("gear").onclick = () => { $("tmdbKey").value=S.tmdb||""; $("omdbKey").value=S.omdb||""; $("app").hidden=true; $("setup").hidden=false; };
$("saveKeys").onclick = () => {
  const k = $("tmdbKey").value.trim();
  if(!k){ $("setupErr").textContent="A TMDB key is required."; return; }
  store("tmdbKey",k); store("omdbKey",$("omdbKey").value.trim()); store("imdbCache3","{}"); location.reload();
};
init();
</script>
